<!doctype html><meta charset="utf-8"><canvas id="canvas"></canvas>
<script type="module">
import init, { open } from "/pkg/readany_render_wasm.js";
try {
  await init();
  const bytes = new Uint8Array(await (await fetch("/fixtures/wide.xlsx")).arrayBuffer());
  const rendered = open(bytes, { filename: "wide.xlsx" });
  const rect = { x: 1280, y: 400, width: 600, height: 400 };
  const items = rendered.itemsInRect(0, rect);
  const info = rendered.pageInfo(0);
  const canvas = document.querySelector("#canvas");
  rendered.renderRectToCanvas(0, rect, canvas, { scale: 1 });
  const pixels = canvas.getContext("2d").getImageData(0, 0, canvas.width, canvas.height).data;
  let dark = 0;
  for (let index = 0; index < pixels.length; index += 4) {
    if (pixels[index] < 250 || pixels[index + 1] < 250 || pixels[index + 2] < 250) dark++;
  }
  document.body.dataset.format = rendered.format;
  globalThis.document.body.dataset.pageWidth = String(info.size.width);
  globalThis.document.body.dataset.items = String(items.length);
  globalThis.document.body.dataset.canvas = `${canvas.width}x${canvas.height}`;
  globalThis.document.body.dataset.dark = String(dark);
  rendered.free();
} catch (error) {
  globalThis.document.body.dataset.error = String(error);
}
globalThis.document.body.dataset.done = "true";
</script>
