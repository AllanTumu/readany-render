name: CI
on: [push, pull_request]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --workspace --all-features

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  wasm-and-performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: ./scripts/check-size.sh
      - run: ./scripts/check-performance.sh

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: |
          for target in render font zip xml csv xlsx ods docx odt rtf pptx odp image; do
            corpus=$(mktemp -d)
            cp "fuzz/seeds/$target/"* "$corpus/"
            cargo fuzz run "$target" "$corpus" -- -max_total_time=15
            rm -rf "$corpus"
          done

  fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libreoffice poppler-utils
      - working-directory: browser
        run: npm ci
      - working-directory: browser
        run: npx playwright install --with-deps chromium
      - run: ./harness/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: fidelity-report, path: harness/report/ }

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo install wasm-pack --locked
      - run: ./scripts/build-wasm.sh bundled pkg
      - working-directory: browser
        run: npm ci
      - working-directory: browser
        run: npx playwright install --with-deps chromium webkit
      - working-directory: browser
        run: npm test
